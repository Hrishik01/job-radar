# Runs the fetcher on a schedule and commits the updated data/jobs.json.
# GitHub Pages then serves the dashboard from the same branch.

name: fetch

on:
  schedule:
    # Cron is always UTC. These times assume Eastern Standard Time (UTC-5,
    # early November to mid March). During daylight time (UTC-4) every run
    # lands one hour later in ET, e.g. 7:17 AM instead of 6:17 AM.
    #
    # GitHub's cron is best-effort: from Nov 5 to Nov 12 it never fired 33
    # of 48 slots (no 6-10 AM ET run at all) and ran the rest a median 80
    # minutes late. So there are many backup slots, at off-peak minutes, and
    # the gate job below skips a run in seconds when the data is still fresh.
    #
    # Every day, every hour at :17 and :47, 6 AM to 11:47 PM ET:
    #   6 AM-6:47 PM ET = 11-23 UTC; 7 PM-11:47 PM ET = 00-04 UTC (next day)
    - cron: "17,47 0-4,11-23 * * *"
  workflow_dispatch: {}  # "Run workflow" button on the Actions tab; always fetches

permissions:
  contents: write  # lets the job push the jobs.json commit

# Never run two fetches at once. A run that arrives while one is fetching
# waits; GitHub keeps one waiting run per group, so a newer arrival replaces
# the waiting one (shown as cancelled). The run that is fetching is never
# cancelled, and a waiting run that starts after it finishes is skipped by
# the gate, since the data is then fresh.
concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  gate:
    # Seconds, not minutes: only jobs.json and the gate script, and the
    # runner's own Python (no setup-python, no pip).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.fresh.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            data/jobs.json
            fetcher/gate.py
          sparse-checkout-cone-mode: false

      # Scheduled runs skip when the last successful fetch finished under 90
      # minutes ago. A manual "Run workflow" always fetches.
      - name: Is the data fresh?
        id: fresh
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: fetching regardless of freshness."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            python3 fetcher/gate.py
          fi

  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Pinned, so GitHub moving ubuntu-latest to a new release can't change
    # the environment under us. Bump this deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 110  # a full fetch of ~1,400 boards takes about 28 minutes on GitHub
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke tests
        run: python -m unittest -v

      # Exits 1 (failing the run, red X, email to the repo owner) when most
      # boards error out. In that case jobs.json is not written, so nothing is
      # committed. A few dead boards show up as yellow warnings instead.
      - name: Fetch jobs
        run: python fetcher/fetch.py

      - name: Commit jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "jobs.json unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Update jobs.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Pick up any commit pushed while the fetch was running.
          git pull --rebase
          git push
